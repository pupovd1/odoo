; Odoo settings shared by every scripts/dev/*.sh command.
;
; Relative paths are resolved from the repository root: the scripts always run
; odoo-bin from there. Settings that differ per command (database, HTTP port,
; demo data, log level) are passed on the command line, so that each command
; the scripts print is complete.
[options]
addons_path = addons,odoo/addons
data_dir = .odoo-data
db_host = 127.0.0.1
db_port = 5432
db_user = odoo
db_password = odoo
; Offline features need a secure context. Binding to the loopback interface
; means the server is only reachable as http://localhost:<port>, which browsers
; treat as secure without HTTPS.
http_interface = 127.0.0.1
workers = 0
